# MIYAKO Medusa backend on Railway (monorepo root).
# Railway dashboard → Settings → Root Directory should stay at repo root (.)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Dockerfile sets WORKDIR=backend/.medusa/server and CMD; this matches both.
startCommand = "npx medusa start"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
